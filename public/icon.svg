<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary Acoustic Wave Gradient (Neon Crimson -> Electric Violet -> Cyan) -->
    <linearGradient id="waveGrad1" x1="10%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#ff1b6b" />
      <stop offset="30%" stop-color="#f43f5e" />
      <stop offset="65%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Secondary Harmonic Ribbon Gradient -->
    <linearGradient id="waveGrad2" x1="90%" y1="15%" x2="10%" y2="85%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="75%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#ff1b6b" />
    </linearGradient>

    <!-- Ambient Center Acoustic Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="rgba(255, 27, 107, 0.45)" />
      <stop offset="50%" stop-color="rgba(139, 92, 246, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 242, 254, 0)" />
    </radialGradient>

    <!-- Luminous Filters for high contrast on dark taskbars -->
    <filter id="neonBloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="specularGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Acoustic Backlight Aura (Transparent Background Silhouette) -->
  <circle cx="256" cy="256" r="170" fill="url(#centerGlow)" />

  <!-- Main Harmonic Ribbon: Bold Eiryn Möbius Soundwave Monogram -->
  <!-- Outer Crest Curve (Top to Bottom loop forming 'E') -->
  <path d="M 390 125 C 210 110, 95 185, 95 256 C 95 327, 210 402, 390 387"
        fill="none" stroke="url(#waveGrad1)" stroke-width="48" stroke-linecap="round"
        filter="url(#neonBloom)" />

  <!-- Middle Harmonic Resonant Bar -->
  <path d="M 105 256 C 180 256, 260 256, 335 256"
        fill="none" stroke="url(#waveGrad2)" stroke-width="38" stroke-linecap="round"
        filter="url(#neonBloom)" />

  <!-- Inner High-Fidelity Wave Core (Pure Specular Luminescence) -->
  <path d="M 370 148 C 225 136, 135 195, 135 256 C 135 317, 225 376, 370 364"
        fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round"
        filter="url(#specularGlow)" />

  <!-- Middle Specular Highlight -->
  <path d="M 125 256 C 185 256, 245 256, 315 256"
        fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round"
        filter="url(#specularGlow)" />

  <!-- Discrete Bit-Perfect Constellation Nodes -->
  <circle cx="390" cy="125" r="14" fill="#ffffff" filter="url(#specularGlow)" />
  <circle cx="335" cy="256" r="12" fill="#ffffff" filter="url(#specularGlow)" />
  <circle cx="390" cy="387" r="14" fill="#00f2fe" filter="url(#specularGlow)" />
</svg>
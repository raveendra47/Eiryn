<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircleClipC2">
      <rect x="64" y="64" width="896" height="896" rx="224" ry="224" />
    </clipPath>
  </defs>

  <!-- Squircle Canvas Background: Deep Obsidian Charcoal -->
  <rect x="64" y="64" width="896" height="896" rx="224" ry="224" fill="#10121A" />

  <g clip-path="url(#squircleClipC2)">
    <!-- Shoulders & Torso Base -->
    <path d="M 120 960 
             C 170 800, 310 720, 480 710 
             C 640 700, 780 770, 900 960 Z" 
          fill="#FFFFFF" />

    <!-- Head & Neck Solid Profile (Facing Right) -->
    <path d="M 430 710 
             C 410 600, 440 490, 480 420 
             C 520 350, 580 320, 640 330 
             C 670 335, 700 355, 715 385 
             C 730 415, 745 425, 770 435 
             C 780 440, 785 450, 780 460 
             C 772 472, 750 478, 740 488 
             C 752 498, 755 512, 742 528 
             C 730 542, 705 550, 675 555 
             C 635 565, 595 595, 570 650 
             C 555 680, 550 700, 550 710 Z" 
          fill="#FFFFFF" />

    <!-- Musical Eighth-Note Hair (Electric Violet #8B5CF6) -->
    <!-- The hair lock rises like an eighth-note stem, arching back into a bold musical flag! -->
    <path d="M 580 330 
             C 560 210, 600 160, 680 180 
             C 760 200, 770 280, 710 320 
             C 670 345, 630 330, 630 260 
             C 630 220, 600 220, 590 260 
             C 575 320, 530 350, 460 380 
             C 360 420, 300 380, 240 330 
             C 270 430, 360 480, 460 450 
             C 520 430, 560 380, 580 330 Z" 
          fill="#8B5CF6" />

    <!-- Musical Note Head Accent (Integrated into hair crown) -->
    <circle cx="715" cy="245" r="38" fill="#FBBF24" />

    <!-- Closed Peaceful Smiling Eye (Deep Obsidian #10121A) -->
    <path d="M 645 420 Q 670 445 695 420" 
          fill="none" stroke="#10121A" stroke-width="16" stroke-linecap="round" />

    <!-- Serene Smile -->
    <path d="M 685 500 Q 705 515 725 498" 
          fill="none" stroke="#10121A" stroke-width="12" stroke-linecap="round" />

    <!-- Minimalist Studio Headphone Headband (Golden Amber #FBBF24) -->
    <path d="M 520 470 C 490 270, 370 200, 290 250" 
          fill="none" stroke="#FBBF24" stroke-width="32" stroke-linecap="round" />

    <!-- Headphone Swivel Yoke (Solid White) -->
    <rect x="502" y="420" width="28" height="48" rx="10" fill="#FFFFFF" />

    <!-- Headphone Outer Earcup (Golden Amber #FBBF24) -->
    <circle cx="516" cy="520" r="96" fill="#FBBF24" />

    <!-- Headphone Inner Cavity (Deep Obsidian #10121A) -->
    <circle cx="516" cy="520" r="60" fill="#10121A" />

    <!-- Headphone Center Core (Electric Violet #8B5CF6) -->
    <circle cx="516" cy="520" r="28" fill="#8B5CF6" />

    <!-- Single Flowing Audio Ribbon / Cable leaving headphone -->
    <path d="M 516 616 
             C 516 720, 600 750, 660 710 
             C 720 670, 780 700, 810 770" 
          fill="none" stroke="#8B5CF6" stroke-width="18" stroke-linecap="round" />

    <!-- Subtle Floating Eighth-Note in front of face (Golden Amber #FBBF24) -->
    <path d="M 800 460 L 800 390 C 825 390, 845 375, 850 360 L 850 380 C 835 400, 820 410, 800 410 Z" fill="#FBBF24" />
    <circle cx="788" cy="465" r="22" fill="#FBBF24" />
  </g>
</svg>
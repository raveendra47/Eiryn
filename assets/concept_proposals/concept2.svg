<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="c2_squircle">
      <rect x="64" y="64" width="896" height="896" rx="224" ry="224" />
    </clipPath>
  </defs>

  <!-- Squircle Canvas: Deep Obsidian Charcoal -->
  <rect x="64" y="64" width="896" height="896" rx="224" ry="224" fill="#10121A" />

  <g clip-path="url(#c2_squircle)">
    <!-- Broad Torso / Shoulder Silhouette Base -->
    <path d="M 100 960 C 160 800, 310 725, 480 715 C 650 705, 800 780, 924 960 Z" fill="#FFFFFF" />

    <!-- Head and Neck Profile (Facing Right, Tilted in Blissful Listening) -->
    <path d="M 430 715 
             C 410 600, 440 490, 480 420 
             C 520 350, 580 320, 640 330 
             C 675 335, 705 355, 720 385 
             C 735 415, 750 425, 775 435 
             C 785 440, 788 452, 780 462 
             C 770 474, 750 478, 742 488 
             C 755 500, 755 514, 742 528 
             C 730 542, 705 550, 675 555 
             C 635 565, 595 595, 570 650 
             C 555 680, 550 705, 550 715 Z" fill="#FFFFFF" />

    <!-- Musical Eighth-Note Hair Crest (Electric Violet #8B5CF6) -->
    <!-- The hair stem sweeps up from the crown and curls backward into an eighth-note banner -->
    <path d="M 590 330 
             C 570 200, 620 150, 700 170 
             C 780 190, 795 270, 735 315 
             C 690 340, 645 325, 645 255 
             C 645 210, 610 210, 600 255 
             C 585 320, 540 350, 460 380 
             C 360 420, 290 375, 230 320 
             C 265 425, 360 480, 460 450 
             C 520 430, 565 380, 590 330 Z" fill="#8B5CF6" />

    <!-- Musical Note Head Accent on top crown -->
    <circle cx="735" cy="240" r="36" fill="#FBBF24" />

    <!-- Serene Closed Smiling Eye -->
    <path d="M 645 422 Q 670 448 695 422" fill="none" stroke="#10121A" stroke-width="16" stroke-linecap="round" />

    <!-- Calm Happy Smile -->
    <path d="M 685 502 Q 705 516 725 499" fill="none" stroke="#10121A" stroke-width="12" stroke-linecap="round" />

    <!-- Headphone Headband (Warm Amber Gold #FBBF24) -->
    <path d="M 520 470 C 490 270, 370 200, 290 250" fill="none" stroke="#FBBF24" stroke-width="32" stroke-linecap="round" />
    
    <!-- Gimbal Yoke Mount -->
    <rect x="502" y="420" width="28" height="48" rx="10" fill="#FFFFFF" />

    <!-- Headphone Outer Ear Cup (Golden Amber #FBBF24) -->
    <circle cx="516" cy="520" r="96" fill="#FBBF24" />
    <!-- Inner Cavity -->
    <circle cx="516" cy="520" r="60" fill="#10121A" />
    <!-- Center Core (Electric Violet #8B5CF6) -->
    <circle cx="516" cy="520" r="28" fill="#8B5CF6" />

    <!-- Flowing Audio Ribbon / Cable below ear -->
    <path d="M 516 616 C 516 720, 600 750, 660 710 C 720 670, 780 700, 810 770" 
          fill="none" stroke="#8B5CF6" stroke-width="18" stroke-linecap="round" />

    <!-- Floating Melody Note (♪) -->
    <g transform="translate(790, 370)">
      <path d="M 28 85 L 28 15 C 48 15, 64 3, 68 -10 L 68 8 C 56 22, 44 30, 28 30 Z" fill="#FBBF24" />
      <ellipse cx="14" cy="90" rx="18" ry="14" transform="rotate(-20 14 90)" fill="#FBBF24" />
    </g>
  </g>
</svg>
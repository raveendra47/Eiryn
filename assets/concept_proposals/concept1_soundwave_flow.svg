<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircleClipC1">
      <rect x="64" y="64" width="896" height="896" rx="224" ry="224" />
    </clipPath>
  </defs>

  <!-- Squircle Canvas Background: Deep Midnight Navy -->
  <rect x="64" y="64" width="896" height="896" rx="224" ry="224" fill="#0B111E" />

  <g clip-path="url(#squircleClipC1)">
    <!-- Shoulders & Torso Base -->
    <path d="M 120 960 
             C 170 810, 310 730, 480 720 
             C 630 710, 770 780, 890 960 Z" 
          fill="#FFFFFF" />

    <!-- Head & Neck Solid Profile (Facing Right) -->
    <!-- Peaceful posture tilted slightly back in musical enjoyment -->
    <path d="M 430 720 
             C 410 610, 440 500, 480 430 
             C 520 360, 580 320, 640 330 
             C 670 335, 700 355, 715 385 
             C 730 415, 745 425, 770 435 
             C 780 440, 785 450, 780 460 
             C 772 472, 750 478, 740 488 
             C 752 498, 755 512, 742 528 
             C 730 542, 705 550, 675 555 
             C 635 565, 595 595, 570 650 
             C 555 680, 550 710, 550 720 Z" 
          fill="#FFFFFF" />

    <!-- Hair Soundwave Crests: Flowing Sinusoidal Waves (Radiant Tangerine #FF6B35) -->
    <!-- Crest 1 (Top Wave: High Frequency) -->
    <path d="M 625 330 
             C 540 240, 440 220, 360 270 
             C 290 315, 230 300, 160 250 
             C 195 330, 260 375, 345 355 
             C 430 335, 510 360, 565 405 Z" 
          fill="#FF6B35" />

    <!-- Crest 2 (Middle Wave: Mid Frequency) -->
    <path d="M 525 390 
             C 450 330, 350 320, 270 365 
             C 205 400, 160 390, 100 340 
             C 130 420, 195 465, 280 445 
             C 365 425, 440 450, 490 490 Z" 
          fill="#FF6B35" />

    <!-- Crest 3 (Lower Wave: Bass Frequency) -->
    <path d="M 470 485 
             C 400 440, 310 440, 240 485 
             C 190 515, 150 505, 110 470 
             C 135 540, 195 580, 265 565 
             C 345 545, 410 565, 455 620 Z" 
          fill="#FF6B35" />

    <!-- Closed Serene Smiling Eye (Deep Midnight #0B111E) -->
    <path d="M 645 420 Q 670 445 695 420" 
          fill="none" stroke="#0B111E" stroke-width="16" stroke-linecap="round" />

    <!-- Gentle Smiling Lip Curve -->
    <path d="M 685 500 Q 705 515 725 498" 
          fill="none" stroke="#0B111E" stroke-width="12" stroke-linecap="round" />

    <!-- Audiophile Headphone: Headband Arc (Electric Cyan #00E5FF) -->
    <path d="M 530 470 C 510 260, 380 180, 280 220" 
          fill="none" stroke="#00E5FF" stroke-width="32" stroke-linecap="round" />

    <!-- Headphone Swivel Yoke (Solid White) -->
    <rect x="512" y="420" width="28" height="48" rx="10" fill="#FFFFFF" />

    <!-- Headphone Outer Earcup Disc (Electric Cyan #00E5FF) -->
    <circle cx="524" cy="520" r="96" fill="#00E5FF" />

    <!-- Inner Acoustic Cavity (Deep Midnight #0B111E) -->
    <circle cx="524" cy="520" r="60" fill="#0B111E" />

    <!-- Center Acoustic Core (Radiant Tangerine #FF6B35) -->
    <circle cx="524" cy="520" r="28" fill="#FF6B35" />

    <!-- Propagating Sound Wavefront Arcs (Sound leaving the listener) -->
    <!-- Wave 1 (Cyan #00E5FF) -->
    <path d="M 790 440 C 825 470, 825 530, 790 560" 
          fill="none" stroke="#00E5FF" stroke-width="18" stroke-linecap="round" />

    <!-- Wave 2 (Tangerine #FF6B35) -->
    <path d="M 840 405 C 895 450, 895 550, 840 595" 
          fill="none" stroke="#FF6B35" stroke-width="18" stroke-linecap="round" />
  </g>
</svg>